# One-click hosting on Render (render.com): New > Blueprint > pick this repository.
# You get an address (something.onrender.com); open it in a browser to play.
services:
  - type: web
    name: multiverse-mayhem
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SERVER_NAME
        value: Multiverse Mayhem
      - key: TRUST_PROXY
        value: "1"
      - key: BOTS
        value: "6"
